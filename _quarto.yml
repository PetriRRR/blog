project:
  type: website
  output-dir: _site

website:
  title: "Petri Rautiainen"
  description: "Investment Analytics, Data & Reproducible Research"

  navbar:
    background: light
    search: true
    left:
      - text: "Home"
        href: index.qmd

      - text: "Research Library"
        href: projects.qmd

      - text: "About"
        href: about.qmd

  sidebar:
    style: docked
    search: true
    collapse-level: 2

    contents:

      - text: "Home"
        href: index.qmd

      - section: "Investment Data"
        href: investment-data/index.qmd
        contents:
          - text: "Concepts"
            href: investment-data/data-quality.qmd

      - section: "Portfolio Analytics"
        href: portfolio-analytics/index.qmd
        contents:
          - text: "Return and Risk"
            href: portfolio-analytics/return-and-risk.qmd
          - text: "Drawdown"
            href: portfolio-analytics/drawdown.qmd

      - section: "Fixed Income"
        href: fixed-income/index.qmd
        contents:
          - text: "Sources of Return"
            href: fixed-income/return-sources.qmd
          - text: "Duration"
            href: fixed-income/duration.qmd

      - section: "Asset Pricing"
        href: factor-investing/index.qmd
        contents:
          - text: "Concept: Factor Investing"
            href: factor-investing/introduction.qmd
          - text: "Tutorial: Download Fama-French Data"
            href: factor-investing/download-data.qmd
          - text: "Research: Historical Factor Returns"
            href: factor-investing/historical-returns.qmd
          - text: "Case Study: Factor Regression"
            href: factor-investing/regression.qmd

      - text: "Research Library"
        href: projects.qmd

      - text: "About"
        href: about.qmd

  page-navigation: true

  page-footer:
    left: "© Petri Rautiainen"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: litera
      dark: darkly

    css: styles.css

    toc: true
    toc-depth: 3

    code-fold: true
    code-tools: true

execute:
  freeze: auto
  warning: false
  message: false
